govern:cis-zero-trust:
  stage: security
  image: python:3.11-slim
  script:
    - 'echo "==> [Stage: GOVERN] CIS Multi-Cloud Zero-Trust Benchmark Audit"'
    - python sentinel/scripts/cis_governance_guard.py --dry-run
  artifacts:
    when: always
    paths:
      - artifacts/cis-governance-report.json
      - artifacts/governance-compliance-report.json



# ==============================================================================
# STAGE 4: TERRAFORM INFRASTRUCTURE VALIDATION (Tasks K1, K2)
# ==============================================================================
infra:terraform-validate:
  stage: infra
  image:
    name: hashicorp/terraform:1.7
    entrypoint: [""]   # the image's entrypoint is `terraform`, which cannot run the job shell
  # Infra is applied by hand for now; a formatting or validation finding is shown, not pipeline-blocking.
  allow_failure: true
  script:
    - cd infra
    - terraform init -backend=false
    - terraform fmt -check
    - terraform validate
  rules:
    - changes:
        - infra/**/*

infra:s3-state-audit:
  stage: infra
  image: python:3.11-slim
  before_script:
    - pip install boto3 botocore jsonschema
  script:
    - echo "==> Running Enterprise S3 Remote State & DynamoDB Distributed Lock Audit"
    - python sentinel/scripts/s3_state_manager.py audit
  artifacts:
    when: always
    paths:
      - artifacts/s3-state-audit-report.json

infra:finops-carbon-guard:
  stage: infra
  image: python:3.11-slim
  before_script:
    - pip install pyyaml jsonschema
  script:
    - echo "==> Evaluating Multi-Cloud FinOps Spend Budget & GreenOps Carbon Intensity"
    - python sentinel/scripts/finops_guard.py --policy sentinel/policy.yaml --output-dir artifacts
  artifacts:
    when: always
    paths:
      - artifacts/finops-cloud-cost-report.json


# ==============================================================================
# STAGES 5-8: DEPLOY, EVALUATE, ROLL BACK, COLLECT EVIDENCE (default branch only)
#
# SENTINEL_DEPLOY_MODE (project CI/CD variable):
#   local    (default) no cloud. The job runs this commit's app (candidate) next to the
#            previous commit's app (stable) and the real evaluator measures both. Nothing is
#            deployed and nothing is rolled back; the pipeline fails if the candidate is unhealthy.
#   cloudrun build the image, deploy it to Cloud Run as a tagged candidate with 0 % traffic,
#            ramp 10 -> 50 -> 100 % with the evaluator after each step, roll back on a breach.
#            Needs: GCP_PROJECT_ID, GCP_REGION, GCP_SA_KEY (File variable, service-account JSON),
#            SENTINEL_BACKEND_URL and SENTINEL_HMAC_SECRET (masked).
# A merged repair MR lands on the default branch, so its pipeline IS the redeploy.
# ==============================================================================
.on-default-branch-local:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SENTINEL_DEPLOY_MODE != "cloudrun"

.on-default-branch-cloudrun:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SENTINEL_DEPLOY_MODE == "cloudrun"

.gcloud:
  image: google/cloud-sdk:slim
  variables:
    TARGET_APP_IMAGE: "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/sentinel/target-app:$CI_COMMIT_SHORT_SHA"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-yaml python3-jsonschema python3-requests > /dev/null
    - if [ -n "$GCP_SA_KEY" ]; then gcloud auth activate-service-account --key-file="$GCP_SA_KEY" --quiet; fi
    - if [ -n "$GCP_PROJECT_ID" ]; then gcloud config set project "$GCP_PROJECT_ID" --quiet; fi

canary:local-evaluate:
  extends: .on-default-branch-local
  stage: evaluate-canary
  image: python:3.11-slim
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl > /dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - pip install -q -r app/requirements.txt pyyaml jsonschema requests
  script:
    - STABLE_SHA="$CI_COMMIT_BEFORE_SHA"
    - if ! git cat-file -e "$STABLE_SHA^{commit}" 2>/dev/null; then STABLE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD); fi
    - echo "==> No cloud deployment (SENTINEL_DEPLOY_MODE=local). Candidate $CI_COMMIT_SHORT_SHA vs stable $(echo $STABLE_SHA | cut -c1-8), both started in this job"
    - git worktree add -q --detach /tmp/stable "$STABLE_SHA"
    - (cd /tmp/stable/app && uvicorn app.main:app --host 127.0.0.1 --port 8080 > /tmp/stable.log 2>&1 &)
    - (cd app && exec uvicorn app.main:app --host 127.0.0.1 --port 8081 > /tmp/candidate.log 2>&1 & echo $! > /tmp/candidate.pid)
    - for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz > /dev/null && curl -sf http://127.0.0.1:8081/healthz > /dev/null && break; sleep 1; done
    # Local "deploy": the candidate is running. Reported like the Cloud Run canary deploy (best effort).
    - >-
      python sentinel/scripts/emit_event.py --type deploy.canary_started --source sentinel-canary-deploy:local
      --pipeline-id "$CI_PIPELINE_ID" --job-id "$CI_JOB_ID" --commit-sha "$CI_COMMIT_SHA"
      --data "{\"revision_name\": \"local-$CI_COMMIT_SHORT_SHA\", \"traffic_percent\": 100, \"target\": \"candidate\"}"
      || echo "[!] could not emit deploy.canary_started (no reachable backend); continuing"
    # On a breach: stop the candidate, prove the stable app healthy (rollback.completed), then fail the job.
    - |
      if ! python sentinel/scripts/evaluator.py --candidate-url http://127.0.0.1:8081 --stable-url http://127.0.0.1:8080 --traffic-percent 100 --revision-name "local-$CI_COMMIT_SHORT_SHA" --pipeline-id "$CI_PIPELINE_ID" --job-id "$CI_JOB_ID" --commit-sha "$CI_COMMIT_SHA"; then
        echo "==> Canary breached. Stopping the candidate; the previous release keeps serving."
        kill "$(cat /tmp/candidate.pid)" 2>/dev/null || true
        python sentinel/scripts/rollback.py --local --stable-url http://127.0.0.1:8080 --known-good-rev "local-$(echo $STABLE_SHA | cut -c1-8)" --candidate-rev "local-$CI_COMMIT_SHORT_SHA" --pipeline-id "$CI_PIPELINE_ID" --job-id "$CI_JOB_ID" --commit-sha "$CI_COMMIT_SHA" || true
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - artifacts/evaluator-report.json
      - artifacts/evaluator-report.md

build:target-app:
  extends: [.gcloud, .on-default-branch-cloudrun]
  stage: deploy-canary
  script:
    - gcloud artifacts repositories describe sentinel --location="$GCP_REGION" > /dev/null 2>&1 || gcloud artifacts repositories create sentinel --repository-format=docker --location="$GCP_REGION" --quiet
    - gcloud builds submit app --tag "$TARGET_APP_IMAGE" --quiet

deploy:canary:
  extends: [.gcloud, .on-default-branch-cloudrun]
  stage: deploy-canary
  needs: [build:target-app]
  script:
    - echo "==> Deploying $TARGET_APP_IMAGE as the tagged candidate (0 % public traffic), then 10 %"
    - python3 sentinel/scripts/canary_deploy.py --service "$TARGET_APP_SERVICE" --image "$TARGET_APP_IMAGE" --region "$GCP_REGION" --traffic-percent 10 --pipeline-id "$CI_PIPELINE_ID" --job-id "$CI_JOB_ID" --commit-sha "$CI_COMMIT_SHA"
  artifacts:
    when: always
    paths:
      - artifacts/canary-deploy-report.json
    reports:
      dotenv: artifacts/deploy.env

evaluate:canary-step:
  extends: [.gcloud, .on-default-branch-cloudrun]
  stage: evaluate-canary
  needs: [deploy:canary]
  script:
    - |
      for pct in 10 50 100; do
        if [ "$pct" != "10" ]; then
          python3 sentinel/scripts/canary_deploy.py --shift-only --service "$TARGET_APP_SERVICE" --region "$GCP_REGION" --traffic-percent "$pct" --candidate-revision "$CANDIDATE_REVISION" --pipeline-id "$CI_PIPELINE_ID" --job-id "$CI_JOB_ID" --commit-sha "$CI_COMMIT_SHA"
        fi
        echo "==> Evaluating candidate at $pct %"
        python3 sentinel/scripts/evaluator.py --candidate-url "$CANDIDATE_URL" --stable-url "$STABLE_URL" --traffic-percent "$pct" --revision-name "$CANDIDATE_REVISION" --pipeline-id "$CI_PIPELINE_ID" --job-id "$CI_JOB_ID" --commit-sha "$CI_COMMIT_SHA"
      done
  artifacts:
    when: always
    paths:
      - artifacts/evaluator-report.json
      - artifacts/evaluator-report.md

rollback:on-breach:
  extends: .gcloud
  stage: rollback
  needs: [deploy:canary, evaluate:canary-step]
  script:
    - 'echo "==> Breach or failed step: sending 100 % of traffic back to $STABLE_REVISION"'
    - python3 sentinel/scripts/rollback.py --service "$TARGET_APP_SERVICE" --region "$GCP_REGION" --stable-url "$STABLE_URL" --known-good-rev "$STABLE_REVISION" --candidate-rev "$CANDIDATE_REVISION" --pipeline-id "$CI_PIPELINE_ID" --job-id "$CI_JOB_ID" --commit-sha "$CI_COMMIT_SHA"
  artifacts:
    when: always
    paths:
      - artifacts/rollback-report.json
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SENTINEL_DEPLOY_MODE == "cloudrun"
      when: on_failure

evidence:collect:
  extends: .gcloud
  stage: evidence
  script:
    - echo "==> Constructing redacted evidence bundle & computing authoritative SHA-256"
    - extra_args="" ; if [ "$SENTINEL_DEPLOY_MODE" != "cloudrun" ]; then extra_args="--dry-run"; fi
    - python3 sentinel/scripts/evidence_collector.py --service "$TARGET_APP_SERVICE" --evaluator-report artifacts/evaluator-report.json --pipeline-id "$CI_PIPELINE_ID" --job-id "$CI_JOB_ID" --commit-sha "$CI_COMMIT_SHA" $extra_args
    # Fixed name so the Duo investigation flow can fetch the bundle from this job's artifacts
    - cp "$(ls -t artifacts/evidence-bundle-*.json | head -1)" artifacts/evidence-bundle.json
  artifacts:
    when: always
    paths:
      - artifacts/evidence-bundle-*.json
      - artifacts/evidence-bundle.json
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_failure

# ==============================================================================
# STAGE 9: VERIFICATION GATES ON REPAIR MRs (Tasks S5, S6, K9)
# ==============================================================================
.repair-mr-gate:
  stage: gate-verify
  image: python:3.11-slim
  variables:
    GIT_DEPTH: "0"          # both the broken (MR base) and fix SHAs must be present
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - pip install -q -r app/requirements.txt pytest jsonschema
    - mkdir -p artifacts
    # Repair branches are duo/fix/inc-<id>; the regression test is tests/regressions/test_inc_<id>.py
    - export INCIDENT_ID="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME#duo/fix/}"
    - export REGRESSION_TEST="tests/regressions/test_$(echo "$INCIDENT_ID" | tr '-' '_').py"
  rules:
    - if: $CI_MERGE_REQUEST_IID && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^duo\/fix\//

gate:regression-proof:
  extends: .repair-mr-gate
  script:
    - 'echo "==> Regression proof for $INCIDENT_ID: $REGRESSION_TEST must fail with an assertion on $CI_MERGE_REQUEST_DIFF_BASE_SHA and pass on $CI_COMMIT_SHA"'
    - status=0
    - python sentinel/scripts/regression_proof.py --broken "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --fix "$CI_COMMIT_SHA" --test "$REGRESSION_TEST" --output-json artifacts/regression-proof.json --output-junit artifacts/regression-proof.xml || status=$?
    - python sentinel/scripts/report_gate_verdict.py --gate regression_proof --report artifacts/regression-proof.json --incident-id "$INCIDENT_ID"
    - exit $status
  artifacts:
    when: always
    paths:
      - artifacts/regression-proof.json
      - artifacts/regression-proof.xml
    reports:
      junit: artifacts/regression-proof.xml

gate:integrity-gate:
  extends: .repair-mr-gate
  script:
    - echo "==> Integrity Gate on the repair diff $CI_MERGE_REQUEST_DIFF_BASE_SHA...$CI_COMMIT_SHA"
    - status=0
    - python sentinel/scripts/integrity_gate.py --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head "$CI_COMMIT_SHA" --output-json artifacts/integrity-gate.json --output-junit artifacts/integrity-gate.xml || status=$?
    - python sentinel/scripts/report_gate_verdict.py --gate integrity --report artifacts/integrity-gate.json --incident-id "$INCIDENT_ID"
    - exit $status
  artifacts:
    when: always
    paths:
      - artifacts/integrity-gate.json
      - artifacts/integrity-gate.xml
    reports:
      junit: artifacts/integrity-gate.xml

# ==============================================================================
# STAGE 10: AUTONOMOUS MERGE (Task K10)
# ==============================================================================
merge:auto-merge:
  stage: auto-merge
  image: python:3.11-slim
  before_script:
    - pip install jsonschema requests
  # Runs only after both gate jobs succeeded (same pipeline, earlier stage), and reads their reports.
  needs:
    - job: gate:regression-proof
      artifacts: true
    - job: gate:integrity-gate
      artifacts: true
  script:
    - echo "==> All required gates green. Merging with the project token (GITLAB_PROJECT_TOKEN, masked)"
    - python sentinel/scripts/auto_merge.py --project-id "$CI_PROJECT_ID" --mr-iid "$CI_MERGE_REQUEST_IID" --fix-sha "$CI_COMMIT_SHA" --incident-id "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME#duo/fix/}"
  # Only where a project token is configured; otherwise a person merges the MR after the gates pass.
  rules:
    - if: $CI_MERGE_REQUEST_IID && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^duo\/fix\// && $GITLAB_PROJECT_TOKEN

# ==============================================================================
# PUBLISH: Mission Control on GitLab Pages
# ==============================================================================
pages:
  stage: publish
  image: node:20-slim
  needs: []
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - |
      if [ -n "$SENTINEL_BACKEND_URL" ] && [ "$SENTINEL_BACKEND_URL" != "http://sentinel-backend:8000" ]; then
        export VITE_API_BASE="$SENTINEL_BACKEND_URL"
      fi
      export VITE_GITLAB_PROJECT_URL="${CI_PROJECT_URL:-https://gitlab.com/$CI_PROJECT_PATH}"
      npm run build -- --base ./
    - cd .. && rm -rf public && cp -r frontend/dist public
  artifacts:
    paths:
      - public
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
