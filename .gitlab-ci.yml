# Project Sentinel — Authoritative GitLab CI/CD Pipeline
# Implements the complete evidence-backed recovery loop:
# AI proposes changes; deterministic gates decide; CI executes actions.

stages:
  - lint
  - test
  - security
  - infra
  - deploy-canary
  - evaluate-canary
  - rollback
  - evidence
  - gate-verify
  - auto-merge
  - publish

variables:
  PYTHONUNBUFFERED: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  SENTINEL_BACKEND_URL: "http://sentinel-backend:8000"   # set to the public backend URL once it is live
  # SENTINEL_HMAC_SECRET is deliberately NOT set here: this repo is public. Define it as a
  # protected + masked project variable (same value as the backend's secret).
  GCP_PROJECT_ID: "project-sentinel-hackathon"
  GCP_REGION: "us-central1"
  GCP_FAILOVER_REGION: "us-east1"
  TARGET_APP_SERVICE: "sentinel-target-app"
  SENTINEL_ENV: "prod"
  SENTINEL_DEPLOY_MODE: "local"   # "cloudrun" once the GCP variables are set (see the deploy stages)
  # Terraform Security Variable Mappings (Injected via TF_VAR_* without hardcoded secrets)
  TF_VAR_project_id: "$GCP_PROJECT_ID"
  TF_VAR_region: "$GCP_REGION"
  TF_VAR_failover_region: "$GCP_FAILOVER_REGION"
  TF_VAR_environment: "$SENTINEL_ENV"
  TF_VAR_initial_hmac_secret: "$SENTINEL_HMAC_SECRET"
  TF_VAR_gitlab_project_path: "$CI_PROJECT_PATH"


cache:
  paths:
    - .cache/pip

# ==============================================================================
# DEVSECOPS 9-STAGE FULL LIFECYCLE AUDIT (Hackathon Prize: Most Stages Covered)
# ==============================================================================
lifecycle:9-stage-audit:
  stage: lint
  image: python:3.11-slim
  script:
    - echo "==> Validating 9-Stage DevSecOps Lifecycle orchestration and coverage"
    - python sentinel/scripts/lifecycle_orchestrator.py --output-dir artifacts
  artifacts:
    when: always
    paths:
      - artifacts/devsecops-9-stage-lifecycle-report.json

plan:finops-greenops:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install pyyaml jsonschema
  script:
    - 'echo "==> [Stage: PLAN] FinOps Forecast & ISO/IEC 21031 SCI Carbon Assessment"'
    - python sentinel/scripts/finops_engine.py --dry-run
    - python sentinel/scripts/sci_carbon_engine.py --dry-run
  artifacts:
    when: always
    paths:
      - artifacts/finops-spend-forecast.json
      - artifacts/finops-cloud-cost-report.json
      - artifacts/sci-carbon-intensity.json
      - artifacts/sci-carbon-intensity-report.json

# ==============================================================================
# STAGE 1: LINT & CONTRACT INTEGRITY
# ==============================================================================
lint:quality-gate:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install ruff pyyaml jsonschema
  script:
    - echo "==> Running Ruff linter"
    - ruff check .
    - echo "==> Validating OpenAPI 3.1.0 and CI Event JSON Schema"
    - python -c "import yaml, json, jsonschema; openapi = yaml.safe_load(open('docs/contracts/openapi.yaml', encoding='utf-8')); schema = json.load(open('docs/contracts/event.schema.json', encoding='utf-8')); jsonschema.Draft202012Validator.check_schema(schema); assert 'paths' in openapi; print('Contracts valid!')"

# ==============================================================================
# STAGE 2: UNIT & COMPONENT TEST SUITES
# ==============================================================================
test:app:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r app/requirements.txt pytest pytest-cov
  script:
    - echo "==> Running Demo Target App test suite"
    - pytest -v --junitxml=junit-app.xml --cov=app/app app/tests
  artifacts:
    when: always
    reports:
      junit: junit-app.xml
    paths:
      - junit-app.xml

test:backend:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r backend/requirements.txt pytest pytest-cov
  script:
    - echo "==> Running Sentinel Backend test suite"
    - pytest -v --junitxml=junit-backend.xml --cov=backend/app backend/tests
  artifacts:
    when: always
    reports:
      junit: junit-backend.xml
    paths:
      - junit-backend.xml

test:sentinel-gates:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r backend/requirements.txt pytest pytest-cov
  script:
    - echo "==> Running Sentinel Gates test suite (Integrity Gate, Regression Proof, Evaluator, SAST, Statistical Analyzer, Chaos, Supply Chain)"
    # tests/regressions/ holds repair-MR tests for the demo app; gate:regression-proof runs them against
    # the right commits. Run here they would import the backend's `app` package instead.
    - pytest -v --junitxml=junit-sentinel.xml tests/ --ignore=tests/regressions
  artifacts:
    when: always
    reports:
      junit: junit-sentinel.xml
    paths:
      - junit-sentinel.xml

chaos:resilience-simulation:
  stage: test
  image: python:3.11-slim
  script:
    - echo "==> Executing Chaos Engineering & Canary Circuit Breaker Simulation"
    - python sentinel/scripts/chaos_engine.py --fault intermittent_503 --iterations 15
  artifacts:
    when: always
    paths:
      - artifacts/chaos-resilience-report.json

chaos:multi-region-dr-drill:
  stage: test
  image: python:3.11-slim
  script:
    - echo "==> Running Multi-Region Zero-Downtime DR Simulation (RTO < 5s, RPO = 0s)"
    - python sentinel/scripts/disaster_recovery.py
  artifacts:
    when: always
    paths:
      - artifacts/disaster-recovery-report.json

chaos:cloud-traffic-rebalance:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install pyyaml jsonschema
  script:
    - echo "==> Running Multi-Region Cloud Resilience & Dynamic Traffic Rebalancing Drill"
    - python sentinel/scripts/cloud_traffic_rebalancer.py --output-dir artifacts
  artifacts:
    when: always
    paths:
      - artifacts/cloud-traffic-rebalance-report.json

test:ebpf-kernel-telemetry:
  stage: test
  image: python:3.11-slim
  script:
    - echo "==> Running L4/L7 eBPF Kernel Transport & TLS Latency Decomposition"
    - python sentinel/scripts/ebpf_tracer.py --samples 15
  artifacts:
    when: always
    paths:
      - artifacts/ebpf-telemetry-report.json

test:drift-detection:
  stage: test
  image: python:3.11-slim
  script:
    - echo "==> Running Statistical EWMA & CUSUM Adaptive Drift Detector"
    - python sentinel/scripts/drift_detector.py
  artifacts:
    when: always
    paths:
      - artifacts/drift-analysis-report.json

# ==============================================================================
# STAGE 3: SECURITY, SAST & SLSA PROVENANCE (Tasks K8, Principal SRE)
# ==============================================================================
