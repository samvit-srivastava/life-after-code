security:cyclonedx-vex:
  stage: security
  image: python:3.11-slim
  script:
    - echo "==> Generating CycloneDX Vulnerability Exploitability eXchange (VEX)"
    - python sentinel/scripts/cyclonedx_vex.py --dry-run
  artifacts:
    when: always
    paths:
      - artifacts/cyclonedx-vex-report.json
      - artifacts/cyclonedx-vex-attestation.json

security:kms-envelope-audit:
  stage: security
  image: python:3.11-slim
  script:
    - echo "==> Auditing Multi-Cloud KMS Envelope Encryption & 90-Day Key Rotation"
    - python sentinel/scripts/kms_auditor.py --dry-run
  artifacts:
    when: always
    paths:
      - artifacts/kms-rotation-report.json
      - artifacts/kms-rotation-audit-report.json

security:cloud-armor-waf:
  stage: security
  image: python:3.11-slim
  script:
    - echo "==> Enforcing Google Cloud Armor Adaptive WAF Layer 7 Mitigations"
    - python sentinel/scripts/cloud_armor_mitigator.py --dry-run
  artifacts:
    when: always
